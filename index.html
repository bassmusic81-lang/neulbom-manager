<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F7EDDD;color:#241708;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.65;}}
:root{
  --primary:#A33208;     /* 단풍 러스트 */
  --primary2:#3F5B1E;    /* 늦가을 올리브 */
  --accent:#0E4C5F;      /* 시린 가을하늘 (한색 대비) */
  --bg:#F7EDDD;          /* 가을 크래프트 */
  --card:#FFFFFF;
  --text:#231404;        /* 밤껍질 브라운블랙 */
  --muted:#6B563F;
  --border:#DCC49F;
  --spring1:#FBE0BE;     /* 호박 틴트 */
  --spring2:#E9EDD6;     /* 올리브 틴트 */
  --spring3:#E4EEF1;     /* 하늘 틴트 */
  --deep:#5A1F06;        /* 진한 대추색 (헤더) */
  --gold:#C8891B;        /* 은행잎 골드 */
}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#screen{flex:1;overflow-y:auto;padding-bottom:68px;}
.tabbar{display:flex;background:#fff;border-top:2px solid #5A1F06;position:fixed;bottom:0;left:0;right:0;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,0.06);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;cursor:pointer;gap:2px;background:none;border:none;}
.tab .ti{font-size:21px;}.tab .tl{font-size:10px;color:#6B563F;font-weight:700;}
.pin-display{display:flex;gap:14px;justify-content:center;margin:20px 0;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid #A33208;transition:all .15s;}
.pin-dot.filled{background:#A33208;transform:scale(1.1);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{background:#fff;border:1.5px solid #C9AC80;border-radius:12px;padding:16px;font-size:22px;font-weight:800;color:#231404;cursor:pointer;text-align:center;}
.key:active{transform:scale(0.93);background:#F1E7D4;}
.key.back{font-size:15px;color:#5E4A38;}
.key.confirm{background:#E2D3B8;color:#6B563F;}
.key.confirm.ready{background:#A33208;color:#fff;}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);background:#5A1F06;padding:8px 0;}
.cal-head-cell{text-align:center;font-size:12px;font-weight:800;color:#F6E3C4;}
.cal-head-cell:first-child{color:#F5A78E;}.cal-head-cell:last-child{color:var(--primary);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:42px;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer;border-top:1px solid #F1E7D4;}
.cal-cell:active{background:#F3E2C4;}
.cal-num{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.cal-num.today{background:#A33208;color:#fff;font-weight:800;}
.cal-num.sel{background:#F3D9A8;color:var(--primary);font-weight:800;border:1.5px solid #A33208;}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px;}
</style>

</head>

function parseSpecialFromNote(note) {
  if(!note) return null;
  const ALL = ["월","화","수","목","금"];
  const sp = {};

  function daysIn(text) { return ALL.filter(d=>text.includes(d)); }
  function addTo(key, arr) {
    if(!arr.length) return;
    sp[key] = [...new Set([...(sp[key]||[]), ...arr])];
  }

  // 전체 취소 (월~금)
  if(/전체\s*취소|월~금.*취소/.test(note)) return { skipDays:[...ALL] };

  // 붙여쓰기 취소: "월취소"
  ALL.forEach(d => { if(note.includes(d+'취소') && !note.includes(d+'취소 후')) addTo('skipDays',[d]); });

  // "X 맞춤형 취소" / "X 취소" (단, "취소 후" 제외)
  for(const m of note.matchAll(/([월화수목금·]+)\s*(?:맞춤형\s*)?취소(?!\s*후)/g))
    addTo('skipDays', daysIn(m[1]));

  // "매일 1교시만"
  if(/매일.*1교시만/.test(note)) sp.skipS2Days=[...ALL];

  // "X 1교시만"
  for(const m of note.matchAll(/([월화수목금·]+)\s*1교시만/g))
    addTo('skipS2Days', daysIn(m[1]));

  // "X 1교시 후 ... 차량/하교" → 1교시 후 하교 = 2교시 취소
  for(const m of note.matchAll(/([월화수목금·]+)\s*1교시\s*(?:후|이후)[^/\n]*(?:차량|하교|귀가)/g))
    addTo('skipS2Days', daysIn(m[1]));

  // "X 2교시 제외/취소/결석"
  for(const m of note.matchAll(/([월화수목금·]+)\s*2교시\s*(?:제외|취소|결석)/g))
    addTo('skipS2Days', daysIn(m[1]));

  // "X → 1교시 취소" (컴퓨터방과후)
  for(const m of note.matchAll(/([월화수목금·]+)[^→\n]*→\s*1교시\s*취소/g))
    addTo('skipS1Days', daysIn(m[1]));

  // "X 1교시 결석"
  for(const m of note.matchAll(/([월화수목금·]+)\s*1교시\s*결석/g))
    addTo('skipS1Days', daysIn(m[1]));

  // "X 2교시 결석"
  for(const m of note.matchAll(/([월화수목금·]+)\s*2교시\s*결석/g))
    addTo('skipS2Days', daysIn(m[1]));

  // 로봇과학A 대체
  if(/화.*로봇과학A/.test(note)) sp.replaceS1={...(sp.replaceS1||{}),화:"로봇과학A"};

  return Object.keys(sp).length>0 ? sp : null;
}

function getStudentSpecial(nm, note) {
  const parsed = parseSpecialFromNote(note) || {};
  const override = MANUAL_OVERRIDE[nm] || {};
  const merged = {...parsed};
  for(const [k,v] of Object.entries(override)){
    if(Array.isArray(v))
      merged[k] = [...new Set([...(merged[k]||[]),...v])];
    else if(v && typeof v==='object')
      merged[k] = {...(merged[k]||{}), ...v};
    else merged[k]=v;
  }
  return Object.keys(merged).length>0 ? merged : null;
}

// ── 수강학생 계산 ──
function getRoster(subj){
  // getSessRoster 전체 요일 합산 → 홈화면 명수와 출석부 명수 완전 일치 보장
  if(!subj) return [];
  const seen = new Set();
  const result = [];
  const srt = (a,b)=>a.grade!==b.grade?a.grade-b.grade:a.cls!==b.cls?a.cls-b.cls:(a.num||99)-(b.num||99);
  for(const day of DAYS){
    const {s1,s2,s3} = getSessRoster(subj, day);
    for(const stu of [...s1,...s2,...s3]){
      if(!seen.has(stu.id)){ seen.add(stu.id); result.push(stu); }
    }
  }
  return result.sort(srt);
}

function getSessRoster(subj,day){
  // ══ 2학기 (8/20~): 반별 SCHEDULES + SEM2_ENROLL(개인 신청) 기반 ══
  if(subj==="로봇과학"){
    const s1=[],s2=[];
    if(day==="화"){
      for(const s of STUDENTS){const n=s.name.replace(/\s+/g,'');if(ROBOT_A.has(n))s1.push(s);if(ROBOT_B.has(n))s2.push(s);}
      const srt=(a,b)=>a.grade!==b.grade?a.grade-b.grade:a.cls!==b.cls?a.cls-b.cls:(a.num||99)-(b.num||99);
      s1.sort(srt); s2.sort(srt);
    }
    return {s1,s2,s3:[]};
  }
  if(subj==="컴퓨터"){
    // 방과후 컴퓨터부 꼬물이(1~2학년) — 화·목 13:50~14:50 단일 세션
    const s1=[],s2=[];
    if(day==="화"||day==="목"){
      for(const s of STUDENTS){
        if(COMPUTER_AB.has(s.clsKey+'|'+s.name.replace(/\s+/g,''))) s1.push(s);
      }
      const srt=(a,b)=>a.grade!==b.grade?a.grade-b.grade:a.cls!==b.cls?a.cls-b.cls:(a.num||99)-(b.num||99);
      s1.sort(srt);
    }
    return {s1,s2,s3:[]};
  }
  const s1=[],s2=[];
  for(const stu of STUDENTS){
    const nm=stu.name.replace(/\s+/g,'');
    const en=SEM2_ENROLL[stu.clsKey+'|'+nm];
    if(!en || en.mode==='NONE') continue;
    const ds=(SCHEDULES[stu.clsKey]||{})[day]||[];
    const robotA=day==='화'&&ROBOT_A.has(nm), robotB=day==='화'&&ROBOT_B.has(nm);
    function has(per){
      switch(en.mode){
        case 'WED1': return day==='수'&&per===0;
        case 'WED': return day==='수';
        case 'NOWED': return day!=='수' && (per===0?en.p1:en.p2);
        case 'P1WED': return day==='수' ? true : per===0;
        case 'MON1': return day==='월' ? per===0 : (per===0?en.p1:en.p2);
        case 'THU1': return day==='목' ? per===0 : (per===0?en.p1:en.p2);
        case 'MON1NOWED': return day==='수' ? false : (day==='월' ? per===0 : (per===0?en.p1:en.p2));
        case 'P1WED_FRI2': return (day==='수'||day==='금') ? true : per===0;
        case 'P1_TUE2': return day==='화' ? true : per===0;
        case 'MONWED_P2': return (day==='월'||day==='수') ? per===1 : (per===0?en.p1:en.p2);
        case 'NOMON': return day==='월' ? false : (per===0?en.p1:en.p2);
        case 'MWF1': return (day==='월'||day==='수'||day==='금') ? per===0 : (per===0?en.p1:en.p2);
        case 'P1': return per===0;
        default: return per===0?en.p1:en.p2;
      }
    }
    const compAB = (day==='화'||day==='목') && COMPUTER_AB.has(stu.clsKey+'|'+nm);
    if(has(0) && !robotA && !compAB && ds[0]===subj) s1.push(stu);
    if(has(1) && !robotB && ds[1]===subj) s2.push(stu);
  }
  const srt=(a,b)=>a.grade!==b.grade?a.grade-b.grade:a.cls!==b.cls?a.cls-b.cls:(a.num||99)-(b.num||99);
  s1.sort(srt); s2.sort(srt);
  return {s1,s2,s3:[]};
}

function getAttNote(note){
  if(!note) return "";
  const KW=["하교","취소","결석","지각","불참","학원","도보","보호자","1교시만","조기","컴퓨터","늦게","미이동","전체취소","귀가","차량","공부","지연"];
  const parts=note.split(/[|\n]/).map(s=>s.trim()).filter(Boolean);
  const matched=parts.filter(p=>KW.some(k=>p.includes(k)));
  return matched.join(" / ");
}

function summerCanon(s){ for(const k in SUMMER_COMBINE){ if(SUMMER_COMBINE[k].includes(s)) return k; } return s; }
const SUMMER_PER_TIME={'1교시':'09:10~09:50','2교시':'10:00~10:40','연차시':'09:10~10:40 (1·2교시 연속)'};
const SUMMER_CC={'A':'#C1440E','B':'#14607F','C':'#4B7A22','D':'#B4451A','E':'#C98213'};
function inSummer(){ const k=todayKey(); return k>=SUMMER_START && k<=SUMMER_END; }
function getInstr(subj){
  if(SUMMER_COMBINE[subj]) subj=SUMMER_COMBINE[subj][0];
  return INSTRUCTOR_MAP[subj] || INSTRUCTOR_MAP[SUMMER_ALIAS[subj]] || null; }
function summerSessionsOf(subj){
  const subs = SUMMER_COMBINE[subj] || [subj];
  const out=[]; const DD=['월','화','수','목','금'];
  for(const c of ['A','B','C','D','E']){
    for(const d of DD){
      const day=SUMMER_SCHED[c] && SUMMER_SCHED[c][d]; if(!day) continue;
      for(const per of ['연차시','1교시','2교시']){
        const it=day[per];
        if(it && subs.includes(it.subj)) out.push({course:c, day:d, per, subj:it.subj, place:it.place, grp:it.grp});
      }
    }
  }
  out.sort((a,b)=> DD.indexOf(a.day)-DD.indexOf(b.day) || ['연차시','1교시','2교시'].indexOf(a.per)-['연차시','1교시','2교시'].indexOf(b.per));
  return out;
}
function summerSubjects(){
  const map={}; const DD=['월','화','수','목','금'];
  for(const c of ['A','B','C','D','E']) for(const d of DD){
    const day=SUMMER_SCHED[c] && SUMMER_SCHED[c][d]; if(!day) continue;
    for(const per in day){ const s=day[per].subj; (map[s]=map[s]||new Set()).add(d); }
  }
  return Object.entries(map).map(([s,ds])=>({subj:s, days:DD.filter(d=>ds.has(d))}));
}
function summerRosterOf(sess){
  if(sess.course==='D') return SUMMER_ROSTER[sess.grp==='돌봄2반'?'D2':'D1']||[];
  return SUMMER_ROSTER[sess.course]||[];
}
function renderSummerLogin(){
  const DD=['월','화','수','목','금'];
  const dayAccent={월:"#B07C10",화:"#C2530F",수:"#4F6B22",목:"#7A4A1F",금:"#A32411"};
  const sel=STATE.selSubj;
  // 요일×차시 그리드 데이터 수집 (과목 중복 제거)
  const grid={'1교시':{},'2교시':{},'연차시':{}};
  for(const c of ['A','B','C','D','E']) for(const d of DD){
    const day=SUMMER_SCHED[c] && SUMMER_SCHED[c][d]; if(!day) continue;
    for(const per in day){
      const s=day[per].subj;
      (grid[per][d]=grid[per][d]||new Set()).add(s);
    }
  }
  const btn=(s)=>{
    const canon=summerCanon(s);
    const on = sel===canon;
    return `<button onclick="selSubj('${canon}')" style="display:block;width:100%;border:1.5px solid ${on?'#C1440E':'#E2D3B8'};
      background:${on?'#FADFC4':'#fff'};border-radius:9px;padding:6px 4px;font-size:12px;font-weight:800;
      font-family:inherit;cursor:pointer;margin-bottom:4px;color:${on?'#9A3A08':'#2E2013'};line-height:1.3;">${s}</button>`;
  };

  const rows=rowDef.map(([per,t])=>{

      const set=grid[per][d];

      return `<td style="border:1px solid #E2D3B8;padding:5px 4px;vertical-align:top;background:#FDF9F1;">${inner}</td>`;

  return `

      <div style="color:rgba(255,255,255,.92);font-size:12.5px;margin-top:7px;">2026. 7. 27.(월) ~ 8. 13.(목) · 평일 14일 · 코스제(A~E)</div>
      <div style="margin-top:10px;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;color:#fff;font-size:12px;font-weight:800;">
        주간 시간표에서 담당 과목을 선택하고, 전화번호 뒤 4자리로 로그인하세요</div>
    </div>
    <div style="padding:14px 10px 8px;">
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
        <thead><tr><th style="border:1px solid #E2D3B8;background:#F6EEDD;font-size:11px;color:#6E5A45;">차시</th>${head}</tr></thead>

      <div style="font-size:10.5px;color:#7E6A50;margin-top:6px;">※ 과목은 여러 요일에 있어도 한 번만 선택하면 모든 수업이 조회됩니다 · 우쿨렐레·놀이음악은 통합 조회</div>
    </div>
    <div style="padding:8px 16px 0;">
      <button onclick="goVerify()" ${sel?'':'disabled'} style="width:100%;border:0;border-radius:14px;padding:15px;
        background:${sel?'linear-gradient(135deg,#E07A3C,#C1440E)':'#DCCCB2'};color:#fff;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;">
        ${sel? sel+' 강사로 계속' : '과목을 선택하세요'}</button>

}

function renderTimetable_inner(){
  // ══ 2학기: 강사별 주간 시간표 — 가로 요일 × 세로 시간 그리드 + 주 이동 ══
  const subj=STATE.selSubj,c=gc(subj);
  const isRobot=subj==="로봇과학";
  const DC={월:"#B07C10",화:"#4F6B22",수:"#C2530F",목:"#7A4A1F",금:"#A32411"};
  // 주차: 주0 = 2026-08-17(월) ~ 주19 = 12/28
  if(typeof window.TT2_WEEK==='undefined'){
    const base=new Date(2026,7,17);
    window.TT2_WEEK=Math.min(Math.max(Math.floor((new Date()-base)/(7*86400000)),0),19);
  }
  const _mon=new Date(new Date(2026,7,17).getTime()+window.TT2_WEEK*7*86400000);
  const _dts=DAYS.map((_,k)=>new Date(_mon.getTime()+k*86400000));
  const _fmt=d2=>`${d2.getMonth()+1}/${d2.getDate()}`;
  const _key=d2=>`${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}-${String(d2.getDate()).padStart(2,'0')}`;
  const TT2_HOLI={'2026-09-24':'추석 연휴','2026-09-25':'추석','2026-10-05':'개천절 대체휴일','2026-10-09':'한글날','2026-12-25':'성탄절','2026-12-31':'종업식','2027-01-01':'신정'};
  const dayOff={};
  DAYS.forEach((d2,k)=>{
    const kk=_key(_dts[k]);
    if(TT2_HOLI[kk]) dayOff[d2]={txt:TT2_HOLI[kk],hol:true};
    else if(kk<'2026-08-20') dayOff[d2]={txt:'개강 전',hol:false};
  });
  // 요일별 세션 수집 (2학기 확정 명단 기반)
  const grid={}; // grid[day] = {s1:{grp,cnt}, s2:{...}}
  for(const day of DAYS){
    const {s1,s2}=getSessRoster(subj, day);
    const grpOf=(list)=>{
      const ks=[...new Set(list.map(st=>st.clsKey))].sort();
      return ks.join('+')||'';
    };
    grid[day]={
      s1: s1.length? {grp:grpOf(s1), cnt:s1.length} : null,
      s2: s2.length? {grp:grpOf(s2), cnt:s2.length} : null,
    };
  }
  const placeOf=(day)=> isRobot ? '2동 1층 전담교실 1' : (typeof getPlaceByDay==='function'? getPlaceByDay(subj,day,'') : (PLACE_MAP[subj]||''));
  const shortPlace=(pl)=> (pl||'').replace(/^\d동 \d층 /,'').replace(/^본동 \d층 /,'');
  function cell(day, sessKey){
    // ══ 9/1(화) 창의코딩 휴강 → 1교시 보드게임 · 2교시 창의활동 ══
    if(DAY_DATES['화']==='9/1' && day==='화' && !dayOff[day]){
      if(subj==='창의코딩'){
        const inner = sessKey==='s1'
          ? `<div style="font-size:11px;font-weight:900;color:#A33208;">휴강</div><div style="font-size:8px;color:#7A3A00;font-weight:700;margin-top:2px;">보드게임 대체 (9/1)</div>`
          : `<div style="font-size:11px;font-weight:900;color:#A33208;">휴강</div><div style="font-size:8px;color:#7A3A00;font-weight:700;margin-top:2px;">2-2 창의활동 대체 (9/1)</div>`;

    if(window.TT2_WEEK===0 && !dayOff[day] && (day==='목'||day==='금')){
      const spBox=(inner,dash)=>`<td style="border:${dash?'2px dashed #E8590C':'1.5px solid #fff'};background:#FFF4EC;border-radius:9px;padding:7px 3px;text-align:center;vertical-align:middle;">${inner}</td>`;
      const tBadge=(t)=>`<div style="font-size:8px;font-weight:900;color:#C0392B;">⏰ ${t}</div>`;
      if(day==='목'){
        if(subj==='오카리나'){
          return spBox(`<div style="font-size:11px;font-weight:900;color:#A33208;">휴강</div><div style="font-size:8px;color:#7A3A00;font-weight:700;margin-top:2px;">영어야놀자 대체 (8/20)</div>`,true);
        }
        if(subj==='영어야놀자'){
          const oca=getSessRoster('오카리나','목');
          const it2=sessKey==='s1'? {grp:'2-1+2-4',cnt:oca.s1.length,t:'13:10~13:50'} : {grp:'1-2+1-4',cnt:oca.s2.length,t:'14:40~15:20'};
          if(!it2.cnt) return `<td style="border:1.5px solid #fff;background:#F6EEDD;border-radius:9px;color:#C4AE90;font-size:13px;text-align:center;">—</td>`;
          return spBox(`<b style="font-size:12px;color:#0B5CAD;display:block;">${it2.grp}</b><div style="font-size:9.5px;color:#0B5CAD;font-weight:800;">${it2.cnt}명</div>${tBadge(it2.t)}<div style="font-size:7.5px;color:#E8590C;font-weight:900;">🔄 오카리나 휴강 대체</div><div style="font-size:8px;color:#6E5A45;font-weight:700;">📍영어체험실</div>`,true);
        }
        if(subj==='방송댄스' && sessKey==='s1'){
          const it=grid['목'].s1;
          return spBox(`<b style="font-size:12px;color:${c};display:block;">2-2 → ${it?it.grp:''}</b><div style="font-size:8.5px;color:${c};font-weight:800;">🔄 2-2 (15명) ⏰13:10 선행</div><div style="font-size:8.5px;color:${c};font-weight:800;">${it?it.grp+' '+it.cnt+'명 13:50':''}</div><div style="font-size:8px;color:#6E5A45;font-weight:700;">📍나리실</div>`,true);
        }
        if(subj==='영어회화'){
          if(sessKey==='s1') return spBox(`<div style="font-size:9.5px;font-weight:900;color:#7A3A00;">2-2 → 2교시 이동</div><div style="font-size:8px;color:#7A3A00;">(2-2는 1교시 방송댄스)</div>`,false);
          const a=grid['목'].s1?grid['목'].s1.cnt:0, b2=grid['목'].s2?grid['목'].s2.cnt:0;
          return spBox(`<b style="font-size:12px;color:${c};display:block;">2-2+2-3 합반</b><div style="font-size:9.5px;color:${c};font-weight:800;">${a+b2}명</div>${tBadge('14:00~14:40')}<div style="font-size:8px;color:#6E5A45;font-weight:700;">📍영어체험실</div>`,true);
        }
        if(subj==='토탈공예'){
          const it=grid['목'][sessKey];
          if(it && /2-/.test(it.grp)){
            return spBox(`<b style="font-size:12px;color:${c};display:block;">${it.grp}</b><div style="font-size:9.5px;color:${c};font-weight:800;">${it.cnt}명</div>${tBadge(sessKey==='s1'?'13:10~13:50':'14:00~14:40')}<div style="font-size:8px;color:#6E5A45;font-weight:700;">📍${shortPlace(placeOf(day))}</div>`,false);
          }
        }
      }
      if(day==='금'){
        if(subj==='놀이체육' && sessKey==='s2'){
          return spBox(`<div style="font-size:10px;font-weight:900;color:#A33208;">2-2 휴강</div><div style="font-size:8px;color:#7A3A00;font-weight:700;margin-top:2px;">창의활동으로 변경 (8/21)</div>`,true);
        }
        const it=grid['금'][sessKey];
        if(it && /2-/.test(it.grp)){
          return spBox(`<b style="font-size:12px;color:${c};display:block;">${it.grp}</b><div style="font-size:9.5px;color:${c};font-weight:800;">${it.cnt}명</div>${tBadge(sessKey==='s1'?'13:10~13:50':'14:00~14:40')}<div style="font-size:8px;color:#6E5A45;font-weight:700;">📍${shortPlace(placeOf(day))}</div>`,false);
        }
      }
    }
    if(dayOff[day]){
      const o=dayOff[day];
      return `<td style="border:1.5px solid #fff;background:${o.hol?'#FBE3D4':'#EFE7D6'};border-radius:9px;padding:8px 3px;text-align:center;"><div style="font-size:9.5px;font-weight:800;color:${o.hol?'#A32C1A':'#6E5A45'};line-height:1.5;">수업 없음<br><span style="font-size:7.5px;font-weight:600;">${o.txt}</span></div></td>`;
    }
    const it=grid[day][sessKey];
    if(!it) return `<td style="border:1.5px solid #fff;background:#F6EEDD;border-radius:9px;color:#C4AE90;font-size:13px;text-align:center;">—</td>`;
    const lbl = isRobot ? (sessKey==='s1'?'A반':'B반') : (subj==='컴퓨터' ? '꼬물이 (1~2학년)' : it.grp);
    return `<td onclick="showRosterPopup('__all__','${day}','${sessKey}')"
      style="border:1.5px solid #fff;background:${c}14;border-radius:9px;padding:8px 3px;text-align:center;cursor:pointer;vertical-align:middle;">
      <b style="font-size:13px;color:${c};display:block;line-height:1.3;">${lbl}</b>
      <div style="font-size:10px;color:${c};font-weight:800;margin-top:2px;">${it.cnt}명</div>
      <div style="font-size:8.5px;color:#6E5A45;font-weight:700;margin-top:1px;">📍${shortPlace(placeOf(day))}</div>
    </td>`;
  }
  // 세로 시간 3행: 수1(13:10) / 1교시(13:50, 수2 14:00) / 2교시(14:40)
  const empt=`<td style="border:1.5px solid #fff;background:#FBF5EA;border-radius:9px;"></td>`;
  const row0=DAYS.map(d2=>d2==='수'?cell('수','s1'):empt).join('');
  const row1=DAYS.map(d2=>d2==='수'?cell('수','s2'):cell(d2,'s1')).join('');
  const row2=DAYS.map(d2=>d2==='수'?empt:cell(d2,'s2')).join('');
  const rowTh=(t)=>`<th style="font-size:8.5px;background:${c}0D;color:${c};border-radius:8px;font-weight:800;padding:5px 1px;line-height:1.5;">${t}</th>`;
  const totalSess=DAYS.reduce((n,d2)=>n+(grid[d2].s1?1:0)+(grid[d2].s2?1:0),0);
  const HOLI_LIST=[['9/24(목)~9/25(금)','추석 연휴'],['10/5(월)','개천절 대체휴일'],['10/9(금)','한글날'],['12/25(금)','성탄절'],['12/31(목)','종업식'],['1/1(금)','신정']];
  return `
    <div style="background:linear-gradient(150deg,${c},${c}CC);padding:52px 20px 18px;">
      <div style="color:rgba(255,255,255,.85);font-size:12px;font-weight:900;">📅 2학기 주간 시간표 · 8/20(목) 개강${subj==="컴퓨터"?' · 방과후 화·목 13:50~14:50':''}</div>
      <div style="color:#fff;font-size:21px;font-weight:900;margin-top:3px;">${subjEmoji(subj)} ${subj}</div>
      <div style="color:rgba(255,255,255,.9);font-size:12px;margin-top:4px;">주 ${totalSess}세션 · 셀을 누르면 수강 명단이 열립니다</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <button onclick="TT2_WEEK=Math.max(0,TT2_WEEK-1);render()" style="background:rgba(255,255,255,.25);border:0;border-radius:8px;color:#fff;font-size:14px;font-weight:900;padding:5px 12px;cursor:pointer;font-family:inherit;">◀</button>
        <div style="flex:1;text-align:center;color:#fff;font-size:13.5px;font-weight:800;">${_fmt(_dts[0])}(월) ~ ${_fmt(_dts[4])}(금) <span style="font-size:10px;opacity:.75;">${TT2_WEEK+1}주차</span></div>
        <button onclick="TT2_WEEK=Math.min(19,TT2_WEEK+1);render()" style="background:rgba(255,255,255,.25);border:0;border-radius:8px;color:#fff;font-size:14px;font-weight:900;padding:5px 12px;cursor:pointer;font-family:inherit;">▶</button>
      </div>
    </div>
    <div style="padding:14px 12px;">
      <div style="background:#fff;border:2px solid ${c};border-radius:14px;padding:10px;">
        <table style="width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;">
          <thead><tr>
            <th style="width:44px;font-size:9px;background:${c}14;color:${c};border-radius:8px;padding:6px 2px;">시간</th>
            ${DAYS.map((d2,k)=>`<th style="font-size:11px;font-weight:800;background:${dayOff[d2]?(dayOff[d2].hol?'#FBE3D4':'#EFE7D6'):DC[d2]};color:${dayOff[d2]?(dayOff[d2].hol?'#A32C1A':'#6E5A45'):'#FFF6E6'};border-radius:8px;padding:5px 2px;">${d2}<br><span style="font-size:8px;font-weight:600;">${_fmt(_dts[k])}</span></th>`).join('')}
          </tr></thead>
          <tbody>
            <tr>${rowTh('13:10<br>~13:50')}${row0}</tr>
            <tr>${rowTh('13:50<br>~14:30<br><span style="font-size:7px;font-weight:600;">수 14:00~14:40</span>')}${row1}</tr>
            <tr>${rowTh('14:40<br>~15:20')}${row2}</tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top:10px;background:#FDF4E2;border:1.5px dashed #C79A2E;border-radius:10px;padding:9px 13px;font-size:11px;color:#5F470C;line-height:1.8;">
        <b>🗓 2학기 수업 없는 날</b><br>
        ${HOLI_LIST.map(([d2,l])=>`${d2} ${l}`).join(' · ')}<br>
        <span style="font-size:10px;">※ 1/4(월)부터 겨울방학 맞춤형 시간표(미정)대로 운영 예정</span>
      </div>
    </div>`;
}

// ── 수강학생 팝업 ──
// ── 반별 시간표 ──
let _ctCls = null;

// 수업별 색상 (학급별 시간표용)
const CLS_TT_COLORS = {
  발레:'#A32E0B',음악줄넘기:'#8A4A0C',놀이체육:'#4F6B22',"축구(풋살)":'#33571A',
  뉴스포츠:'#0E4C5F',오카리나:'#8C2F0D',종이접기:'#C2530F',그림책놀이:'#6E2408',
  주산암산:'#5F7A1E',토탈공예:'#4A2A17',창의미술:'#8E2A0A',
  칼라클레이:'#C1440E',창의과학:'#14506B',중국어:'#9A3A08',
  방송댄스:'#7A2408',전래놀이:'#6B5A10',
  보드게임:'#5A1F06',우쿨렐레:'#7A4A1F',도자공예:'#3B2114',
  영어회화:'#B07C10',영어야놀자:'#8A6A12',
  로봇과학:'#B23A0C',컴퓨터:'#33571A',바이올린:'#8C2F0D',배드민턴:'#14606B',
  책놀이:'#4F6B22',전통놀이:'#4A2A17',
};
function ctColor(s){ return CLS_TT_COLORS[s]||'#3A2A1E'; }

function renderClassTimetable(){
  if(!_ctCls) _ctCls = Object.keys(SCHEDULES)[0] || '1-1';
  const sc = SCHEDULES[_ctCls]||{};
  const grade = parseInt(_ctCls[0]);
  const is2 = grade===2;
  const hc = is2?'#A6461A':'#B23A0C';
  const COL={월:"#B07C10",화:"#4F6B22",수:"#C2530F",목:"#7A4A1F",금:"#A32411"};
  const DAYS2=["월","화","수","목","금"];

  function getSlot(day,idx){
    const ds=sc[day]||[];
    if(!is2){
      if(day==='월'||day==='수') return idx===0?ds[0]||null:idx===1?ds[1]||null:null;
      else return idx===0?'정규':idx===1?ds[0]||null:idx===2?ds[1]||null:null;
    } else {
      if(day==='수') return ds[idx]||null;
      else if(day==='월') return idx===0?'정규':idx===1?ds[1]||null:idx===2?ds[2]||null:null;
      else return idx===0?'정규':idx===1?ds[0]||null:idx===2?ds[1]||null:null;
    }
  }

  const slotLabels=!is2?['맞춤형<br>1교시','맞춤형<br>1교시','맞춤형<br>2교시']:['맞춤형<br>1교시','맞춤형<br>2교시','맞춤형<br>3교시'];

  // 이번 주 수업별 장소 요약 카드
  function placeSummaryCard(){
    const subjSet = new Set();
    DAYS2.forEach(d=>{
      for(let i=0;i<3;i++){
        const s=getSlot(d,i);
        if(s&&s!=='정규') s.split('+').forEach(x=>subjSet.add(x.trim()));
      }
    });
    const items=[...subjSet].map(s=>{
      const color=ctColor(s);
      const place=getPlaceByDay(s,'월','')||getPlaceByDay(s,'화','')||getPlaceByDay(s,'수','')||'';
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #FBF3E7;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></span>
        <span style="font-size:11px;font-weight:800;color:${color};min-width:60px;">${s}</span>
        <span style="font-size:11px;color:#4A382A;flex:1;">📍 ${place||'장소 미정'}</span>
      </div>`;
    }).join('');
    return `<div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.07);">
      <div style="font-size:11px;font-weight:800;color:${hc};margin-bottom:8px;">📍 이번 주 수업 장소</div>
      ${items}
    </div>`;
  }

  // 수업장소 팝업
  function subjChip(subj, day, slotIdx){
    const color = ctColor(subj);
    const escapedSubj = subj.replace(/'/g,"\\'");
    const place = getPlaceByDay(subj, day, '');
    const escapedPlace = place.replace(/'/g,"\\'");
    const escapedCls = _ctCls.replace(/'/g,"\\'");
    return `<div onclick="showClsPlacePopup('${escapedSubj}','${escapedPlace}','${day}','${escapedCls}',${slotIdx})"
      style="background:${color};color:#fff;border-radius:8px;padding:5px 3px;
      min-height:38px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;box-shadow:0 1px 4px ${color}88;">
      <span style="font-size:9px;font-weight:900;text-align:center;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,0.25);padding:0 2px;">${subj}</span>
    </div>`;
  }

  function slotRow(idx){
    return `<tr style="border-top:${idx===0?'2px solid '+hc:'1px solid #DCCCB2'}">
      <td style="padding:5px 3px;background:${hc}18;font-size:8px;color:${hc};font-weight:800;text-align:center;min-width:46px;line-height:1.4">${slotLabels[idx]}</td>
      ${DAYS2.map(d=>{
        const [m2,dy2]=(DAY_DATES[d]||'/').split('/');
        const yr2=new Date().getFullYear();
        const dk=`${yr2}-${String(m2).padStart(2,'0')}-${String(dy2).padStart(2,'0')}`;
        if(NO_CLASS_DATES&&NO_CLASS_DATES[dk]) return `<td style="padding:3px 2px;text-align:center"><div style="background:#EDE1CC;border-radius:6px;padding:6px 2px;font-size:8px;color:#9C8770;min-height:34px;display:flex;align-items:center;justify-content:center">🚫</div></td>`;
        const subj=getSlot(d,idx);
        if(!subj) return `<td style="padding:3px 2px;text-align:center"><div style="background:#F6EEDD;border-radius:6px;padding:6px 2px;font-size:8px;color:#C4AE90;min-height:34px;display:flex;align-items:center;justify-content:center">—</div></td>`;
        if(subj==='정규') return `<td style="padding:3px 2px;text-align:center"><div style="background:#EFE6D6;border-radius:6px;padding:6px 2px;font-size:8px;color:#6E5A45;min-height:34px;display:flex;align-items:center;justify-content:center">정규수업</div></td>`;
        return `<td style="padding:3px 2px;text-align:center">${subjChip(subj,d,idx)}</td>`;
      }).join('')}
    </tr>`;
  }

  return `<div style="background:#FDF4E6;min-height:100vh;" id="cls-tt-wrap">
    ${hdr("학급별 시간표","📋",hc)}
    <!-- 반 탭 -->
    <div style="display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #EDE1CC;padding:10px 12px;gap:6px;position:sticky;top:0;z-index:10;">
      ${Object.keys(SCHEDULES).map(k=>{
        const g=parseInt(k[0]);
        const kc=g===1?'#B23A0C':'#A6461A';
        return `<button onclick="_ctCls='${k}';document.getElementById('cls-tt-wrap').outerHTML=renderClassTimetable()"
          style="flex-shrink:0;padding:6px 14px;border-radius:20px;border:2px solid ${_ctCls===k?kc:'#EDE1CC'};background:${_ctCls===k?kc:'#fff'};color:${_ctCls===k?'#fff':'#3B2A1C'};font-size:13px;font-weight:700;cursor:pointer">${k}</button>`;
      }).join('')}
    </div>
    <!-- 시간표 -->
    <div style="padding:12px">
      <div style="background:${hc};border-radius:12px 12px 0 0;padding:10px 14px;text-align:center">
        <div style="color:#fff;font-size:13px;font-weight:800">${_ctCls} · 이번 주 맞춤형 시간표</div>
      </div>
      <div style="background:#fff;border-radius:0 0 12px 12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.07)">
        <table style="width:100%;border-collapse:collapse">
          <tr>
            <th style="background:#33261A;color:#fff;padding:7px 3px;font-size:9px;text-align:center;width:46px">교시</th>
            ${DAYS2.map(d=>{
              const [m,dy]=(DAY_DATES[d]||'/').split('/');
              const yr=new Date().getFullYear();
              const key=`${yr}-${String(m).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
              const noClass=NO_CLASS_DATES&&NO_CLASS_DATES[key];
              return `<th style="background:${noClass?'#7A6754':COL[d]};color:#fff;padding:6px 2px;font-size:11px;font-weight:800;text-align:center">
                <div>${d}</div>
                <div style="font-size:8px;font-weight:400;opacity:0.9">${DAY_DATES[d]||''}</div>
                ${noClass?`<div style="font-size:6px;background:rgba(0,0,0,0.25);border-radius:3px;padding:1px 3px;margin-top:1px">🚫</div>`:''}
              </th>`;
            }).join('')}
          </tr>
          <tr style="background:#F6EEDD">
            <td style="padding:5px 3px;background:#F1E8D8;font-size:8px;color:#6E5A45;font-weight:700;text-align:center">정규<br>~13:10</td>
            ${DAYS2.map(d=>`<td style="padding:3px 2px;text-align:center"><div style="background:#F3EAD9;border-radius:6px;padding:5px 2px;font-size:8px;color:#6E5A45;min-height:26px;display:flex;align-items:center;justify-content:center">정규수업</div></td>`).join('')}
          </tr>
          ${slotRow(0)+slotRow(1)+slotRow(2)}
          <tr style="background:#F2F5E6">
            <td style="padding:5px 3px;background:#E4EDD3;font-size:8px;color:#33571A;font-weight:700;text-align:center">하교</td>
            ${DAYS2.map(d=>`<td style="padding:3px 2px;text-align:center"><div style="background:#E4EDD3;border-radius:6px;padding:4px 2px;font-size:8px;color:#33571A;min-height:26px;display:flex;align-items:center;justify-content:center">🏠${(!is2&&(d==='월'||d==='수'))||(is2&&d==='수')?'14:40':'15:20'}</div></td>`).join('')}
          </tr>
        </table>
      </div>
      <div style="background:#FBEBC6;border-radius:8px;padding:8px 12px;margin-top:8px;border:1px solid #C2B310">
        <div style="font-size:10px;color:#6B2704">※ 화·목·금 맞춤형 수업 13:50 시작 · 월·수 13:10 시작</div>
      </div>
    </div>
  </div>`;
}

function renderTimetable_safe(){
  try{
    return renderTimetable_inner();
  } catch(err){
    return `<div style="padding:20px;color:red;font-size:13px;background:#FDF0E8;border-radius:8px;margin:12px;">
       <b>⚠️ 시간표 오류</b><br><br>${err.message}<br><br>
       <small>${err.stack.split("\n").slice(0,4).join("<br>")}</small>
     </div>`;
  }
}

// ─── 학생 검색 화면 ───
function renderStudentSearch(){
  const q = (STATE.searchQuery || '').trim();
  // 검색: 이름 부분 일치 (한 글자 이상 입력 시)
  let results = [];
  if(q.length > 0){
    results = STUDENTS.filter(s => {
      const nm = (s.name || '').trim();
      // 공백 제거 후 비교 (예: "정 건" → "정건")
      return nm.replace(/\s+/g,'').includes(q.replace(/\s+/g,''));
    }).sort((a,b) => {
      // 1·2학년·번호 순
      if(a.grade !== b.grade) return a.grade - b.grade;
      if(a.cls !== b.cls) return a.cls - b.cls;
      return (a.num || 99) - (b.num || 99);
    });
  }

  return `
  <div style="min-height:100%;background:var(--bg);">
    <!-- 헤더 -->
    <div style="background:linear-gradient(160deg,#5A1F06,#A33208);padding:16px 20px;display:flex;align-items:center;gap:10px;">
      <button onclick="goScreen('home')"
        style="background:#FFF8EC;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:800;color:#5A1F06;cursor:pointer;">‹</button>
      <div style="flex:1;">
        <div style="font-size:18px;font-weight:900;color:#FFF8EC;">🔍 학생 검색</div>
        <div style="font-size:11px;color:#F0C98F;margin-top:2px;font-weight:600;">이름으로 학생의 수강 현황 추적</div>
      </div>
    </div>

    <!-- 검색바 (input 요소 안 건드림 → 한글 IME 안전) -->
    <div style="padding:16px 14px 8px;">
      <div style="position:relative;">
        <input id="stu-search-input" type="text" value="${q.replace(/"/g,'&quot;')}"
          oninput="STATE.searchQuery=this.value;_updateStudentSearchBody()"
          placeholder="학생 이름 입력 (예: 김민준, 이산)"
          autofocus
          style="width:100%;padding:14px 44px 14px 16px;border:2px solid #F5CE96;border-radius:14px;font-size:15px;font-weight:600;background:#fff;box-sizing:border-box;outline:none;"
        />
        <button id="stu-search-clear" onclick="STATE.searchQuery='';document.getElementById('stu-search-input').value='';_updateStudentSearchBody();document.getElementById('stu-search-input').focus()"
          style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#E6D3B8;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;color:#6E5A45;display:${q?'inline-block':'none'};">✕</button>
        <span id="stu-search-icon" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#8A7350;pointer-events:none;display:${q?'none':'inline'};">🔍</span>
      </div>
      <div id="stu-search-count" style="margin-top:10px;font-size:12px;color:var(--muted);">
        ${q ? `${results.length}명 검색됨` : `총 ${STUDENTS.length}명 등록된 학생 중에서 검색`}
      </div>
    </div>

    <!-- 결과 리스트 -->
    <div id="stu-search-results" style="padding:0 14px 80px;">${_renderSearchResults()}</div>
  </div>`;
}

// 검색·삭제 버튼 클릭 시 input 외 요소만 부분 업데이트 (한글 IME 안전)
function _updateStudentSearchBody(){
  const q = (STATE.searchQuery || '').trim();
  // ✕ 버튼·🔍 아이콘 토글 (input 요소 자체는 안 건드림)
  const clearBtn = document.getElementById('stu-search-clear');
  if(clearBtn) clearBtn.style.display = q ? 'inline-block' : 'none';
  const icon = document.getElementById('stu-search-icon');
  if(icon) icon.style.display = q ? 'none' : 'inline';
  // 결과 영역 갱신
  const resultsEl = document.getElementById('stu-search-results');
  if(resultsEl) resultsEl.innerHTML = _renderSearchResults();
  // 카운트 갱신
  _updateSearchCount();
}

// 검색 결과 부분만 렌더링 (입력할 때마다 호출)
function _renderSearchResults(){
  const q = (STATE.searchQuery || '').trim();
  if(q.length === 0){
    return `<div style="padding:40px 20px;text-align:center;color:#7A6754;font-size:13px;line-height:1.7;">
      <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">🔍</div>
      학생의 이름을 입력하면<br>해당 학생이 듣는 수업을 확인할 수 있습니다.
    </div>`;
  }
  const results = STUDENTS.filter(s => {
    const nm = (s.name || '').trim();
    return nm.replace(/\s+/g,'').includes(q.replace(/\s+/g,''));
  }).sort((a,b) => {
    if(a.grade !== b.grade) return a.grade - b.grade;
    if(a.cls !== b.cls) return a.cls - b.cls;
    return (a.num || 99) - (b.num || 99);
  });

  if(results.length === 0){
    return `<div style="padding:40px 20px;text-align:center;color:#7A6754;font-size:13px;line-height:1.7;">
      <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">😕</div>
      <b>'${q}'</b>(으)로 검색된 학생이 없습니다.<br>
      <span style="font-size:11px;">이름의 일부만 입력해보세요. (예: '김')</span>
    </div>`;
  }
  // 결과 카드: 학년·반·번호·이름·노트 미리보기 → 클릭 시 학생 모달
  return results.map(s => {
    const grColor = s.grade === 1 ? '#B23A0C' : '#A6461A';
    const isAlert = (s.note || '').split('\n').some(l => l.trim().startsWith('⚠️'));
    const notePreview = (s.note || '').split('\n').filter(l => !l.trim().startsWith('⚠️')).join(' / ').slice(0, 50);
    return `<div onclick="showStuSchedulePopup('${s.id}')"
      style="background:#fff;border:1px solid ${grColor}33;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
      <div style="background:${grColor};color:#fff;border-radius:10px;padding:8px 10px;min-width:54px;text-align:center;">
        <div style="font-size:9px;font-weight:700;opacity:0.85;">${s.clsLabel}</div>
        <div style="font-size:14px;font-weight:900;margin-top:2px;">${s.num || '-'}번</div>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:15px;font-weight:900;color:${grColor};">${s.name}</span>
          ${isAlert ? `<span style="background:#B9291A;color:#fff;font-size:9px;font-weight:900;padding:1px 6px;border-radius:8px;">⚠️ 응급</span>` : ''}
        </div>
        ${notePreview ? `<div style="font-size:10px;color:#7A6754;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${notePreview}</div>` : ''}
      </div>
      <span style="color:#8A7350;font-size:18px;">›</span>
    </div>`;
  }).join('');
}

function _updateSearchCount(){
  const q = (STATE.searchQuery || '').trim();
  const el = document.getElementById('stu-search-count');
  if(!el) return;
  if(!q){ el.textContent = `총 ${STUDENTS.length}명 등록된 학생 중에서 검색`; return; }
  const cnt = STUDENTS.filter(s => (s.name || '').trim().replace(/\s+/g,'').includes(q.replace(/\s+/g,''))).length;
  el.textContent = `${cnt}명 검색됨`;
}

      </div>
    </div>
  </div>`;
}



function showNotif(html){
  let ov=document.getElementById('_cls_popup');
  if(!ov){ov=document.createElement('div');ov.id='_cls_popup';document.body.appendChild(ov);}
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.onclick=e=>{if(e.target===ov)closeNotif();};
  ov.innerHTML=`<div style="background:#fff;border-radius:18px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.25);">${html}</div>`;
}
function closeNotif(){const el=document.getElementById('_cls_popup');if(el)el.style.display='none';}

function showClsPlacePopup(subj, place, day, filterClsKey, filterSlotIdx){
  const color = ctColor(subj);
  const DAY_COLORS={월:'#B07C10',화:'#4F6B22',수:'#C2530F',목:'#7A4A1F',금:'#A32411'};
  const dc = DAY_COLORS[day]||'#4A382A';
  // 강사 정보
  let instrInfo = '';
  if(window.INSTRUCTOR_MAP && INSTRUCTOR_MAP[subj]){
    const ins = INSTRUCTOR_MAP[subj];
    instrInfo = `<div style="margin-top:8px;background:#FAF3E8;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:16px;">👤</span>
      <div>
        <div style="font-size:12px;font-weight:800;color:#3B2A1C;">${ins.name}</div>
        <a href="tel:${ins.phone}" style="font-size:11px;color:#14507A;font-weight:700;text-decoration:none;">📞 ${ins.phone}</a>
      </div>
    </div>`;
  }
  // 수강생 명수 (해당 수업·요일·반·슬롯 기준)
  let rosterInfo = '';
  try {
    const r = getSessRoster(subj, day) || {s1:[],s2:[],s3:[]};
    // 학급별 시간표에서 호출된 경우: 그 슬롯만 필터링 (같은 수업·같은 슬롯의 모든 반 학생 표시)
    let scope;
    if(typeof filterSlotIdx === 'number'){
      // filterClsKey는 학년 정보 추출용 (슬롯 매핑 결정)
      const grade = filterClsKey ? parseInt(filterClsKey[0]) : 1;
      let slotKey;
      if(grade === 1){
        slotKey = filterSlotIdx === 0 ? 's1' : 's2';
      } else {
        // 2학년
        if(day === '월') slotKey = filterSlotIdx === 0 ? 's2' : 's3';
        else             slotKey = filterSlotIdx === 0 ? 's1' : 's2';
      }
      // 해당 슬롯의 모든 학생 (반 무관 - 같이 듣는 학생 모두 표시)
      scope = r[slotKey] || [];
    } else {
      // 일반 호출 (강사 본인 시간표 등): 전체 슬롯 합산
      const all = [...(r.s1||[]), ...(r.s2||[]), ...(r.s3||[])];
      scope = [...new Map(all.map(s=>[s.id,s])).values()];
    }
    const total = scope.length;
    if(total > 0){
      // 학급별 그룹핑
      const byCls = {};
      scope.forEach(s=>{
        const k = s.clsKey || `${s.grade}-${s.cls}`;
        if(!byCls[k]) byCls[k]=[];
        byCls[k].push(s);
      });
      const sortedCls = Object.keys(byCls).sort();
      const clsRows = sortedCls.map(k=>{
        const list = byCls[k].sort((a,b)=>(a.num||99)-(b.num||99));
        const nameLinks = list.map(s => {
          const isAlert = (s.note||'').split('\n').some(l => l.trim().startsWith('⚠️'));
          return `<span onclick="closeNotif();setTimeout(()=>showStuSchedulePopup('${s.id}'),80)"
            style="cursor:pointer;color:#14507A;font-weight:700;padding:2px 6px;border-radius:6px;display:inline-block;background:#E2EEF2;margin:2px 3px 2px 0;"
            onmouseover="this.style.background='#CFE1E8'" onmouseout="this.style.background='#E2EEF2'">${s.name}${isAlert?'<span style="color:#B9291A;font-weight:900;margin-left:3px;">⚠️</span>':''}</span>`;
        }).join('');
        return `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #F1E7D4;flex-wrap:wrap;">
          <span style="background:${color}22;color:${color};border-radius:5px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0;">${k}</span>
          <span style="font-size:10px;color:#7A6754;white-space:nowrap;flex-shrink:0;align-self:center;">${list.length}명</span>
          <span style="font-size:11px;color:#3B2A1C;line-height:1.6;flex:1;min-width:0;">${nameLinks}</span>
        </div>`;
      }).join('');
      rosterInfo = `
        <div style="margin-top:10px;background:#fff;border:1px solid ${color}33;border-radius:12px;padding:12px 14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <div style="font-size:11px;color:${color};font-weight:800;">👥 수강생</div>
            <div style="background:${color};color:#fff;border-radius:10px;padding:2px 10px;font-size:11px;font-weight:900;">${total}명</div>
          </div>
          ${clsRows}
        </div>`;
    } else {
      rosterInfo = `<div style="margin-top:10px;background:#FBF5EA;border-radius:10px;padding:10px;text-align:center;font-size:11px;color:#7A6754;">수강생 없음</div>`;
    }
  } catch(e) {}

  showNotif(`
    <div style="background:${color};border-radius:14px 14px 0 0;padding:14px 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="color:#fff;font-size:16px;font-weight:900;">${subj}</div>
          <div style="color:rgba(255,255,255,0.8);font-size:11px;margin-top:2px;">
            <span style="background:${dc};border-radius:5px;padding:1px 8px;font-size:10px;font-weight:800;color:#fff;">${day}요일</span>
          </div>
        </div>
        <button onclick="closeNotif()" style="background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;cursor:pointer;">✕</button>
      </div>
    </div>
    <div style="padding:14px;max-height:65vh;overflow-y:auto;">
      <div style="background:${color}0F;border-radius:12px;padding:13px 15px;border-left:3px solid ${color};">
        <div style="font-size:10px;color:${color};font-weight:700;margin-bottom:4px;">📍 수업 장소</div>
        <div style="font-size:16px;font-weight:900;color:#1A1008;">${place||'장소 미정'}</div>
      </div>
      ${instrInfo}
      ${rosterInfo}
    </div>
  `);
}
function renderTimetable_safe(){
  try {
    return renderTimetable_inner();
  } catch(err) {
    console.error("renderTimetable 오류:", err.message, err.stack);
    return `<div style="padding:20px;color:red;font-size:14px;word-break:break-all;">
      <b>⚠️ 시간표 오류</b><br><br>${err.message}<br><br>
      <small>${err.stack.split("\n").slice(0,4).join("<br>")}</small>
    </div>`;
  }
}

function showStuSchedulePopup(stuId){
  // ══ 2학기: SEM2_ENROLL(개인 신청) + 반별 SCHEDULES 기반 ══
  const stu = STUDENTS.find(s=>s.id===stuId);
  if(!stu) return;
  const sc = SCHEDULES[stu.clsKey]||{};
  const grColor = stu.grade===1?'#B23A0C':'#A6461A';
  const DAYS2=["월","화","수","목","금"];
  const COL={월:"#B07C10",화:"#4F6B22",수:"#C2530F",목:"#7A4A1F",금:"#A32411"};
  const nm = stu.name.replace(/\s+/g,'');
  const en = SEM2_ENROLL[stu.clsKey+'|'+nm];
  const robotA = ROBOT_A.has(nm), robotB = ROBOT_B.has(nm);
  function has(day, per){
    if(!en || en.mode==='NONE') return false;
    switch(en.mode){
      case 'WED1': return day==='수'&&per===0;
      case 'WED': return day==='수';
      case 'NOWED': return day!=='수' && (per===0?en.p1:en.p2);
      case 'P1WED': return day==='수' ? true : per===0;
        case 'MON1': return day==='월' ? per===0 : (per===0?en.p1:en.p2);
        case 'THU1': return day==='목' ? per===0 : (per===0?en.p1:en.p2);
        case 'MON1NOWED': return day==='수' ? false : (day==='월' ? per===0 : (per===0?en.p1:en.p2));
        case 'P1WED_FRI2': return (day==='수'||day==='금') ? true : per===0;
        case 'P1_TUE2': return day==='화' ? true : per===0;
        case 'MONWED_P2': return (day==='월'||day==='수') ? per===1 : (per===0?en.p1:en.p2);
        case 'NOMON': return day==='월' ? false : (per===0?en.p1:en.p2);
        case 'MWF1': return (day==='월'||day==='수'||day==='금') ? per===0 : (per===0?en.p1:en.p2);
      case 'P1': return per===0;
      default: return per===0?en.p1:en.p2;
    }
  }
  const rows = DAYS2.map(d=>{
    const ds = sc[d]||[];
    let s1 = ds[0], s2 = ds[1];
    if(d==='화' && robotA) s1='로봇과학A';
    if(d==='화' && robotB) s2='로봇과학B';
    const slots=[];
    const compAB=(d==='화'||d==='목') && COMPUTER_AB.has(stu.clsKey+'|'+nm);
    if(compAB) slots.push('컴퓨터(방과후)');
    else if((has(d,0)||(d==='화'&&robotA)) && s1 && s1!=='—') slots.push(s1);
    if((has(d,1)||(d==='화'&&robotB)) && s2 && s2!=='—') slots.push(s2);
    const chips = slots.length ? slots.map(s=>{
      const t1 = d==='수'?'13:10':'13:50', t2 = d==='수'?'14:00':'14:40';
      const isFirst = s===slots[0] && slots.length===2 || (slots.length===1 && ((has(d,0)||(d==='화'&&robotA)) && s===((d==='화'&&robotA)?'로봇과학A':ds[0])));
      return `<span style="display:inline-block;background:${COL[d]}14;color:${COL[d]};border:1px solid ${COL[d]}44;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800;margin:2px 3px 2px 0;">${subjEmoji(s.replace(/로봇과학[AB]/,'로봇과학'))} ${s.replace('로봇과학A','로봇과학 A반').replace('로봇과학B','로봇과학 B반')}</span>`;
    }).join('') : `<span style="font-size:11px;color:#9C8770;">—</span>`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #EDE1CC;">
      <span style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:${COL[d]}18;color:${COL[d]};font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;">${d}</span>
      <div style="flex:1;">${chips}</div></div>`;
  }).join('');
  const modeTxt = !en||en.mode==='NONE' ? '<div style="margin-top:8px;background:#FDF0E8;border-radius:8px;padding:8px 12px;font-size:11.5px;color:#A32C1A;">2학기 맞춤형 미신청 학생입니다.</div>'
    : (en.mode!=='STD' ? `<div style="margin-top:8px;background:#FDF4E2;border-radius:8px;padding:8px 12px;font-size:11.5px;color:#74561A;">참여 형태: ${{'WED1':'수요일 1교시만','WED':'수요일 1·2교시만','NOWED':'수요일 제외','P1WED':'월·화·목·금 1교시 + 수요일 전체','P1':'1교시만'}[en.mode]||''}</div>` : '');
  const noteHtml = stu.note ? `<div style="margin-top:8px;background:#F3F7F9;border-radius:8px;padding:8px 12px;font-size:11px;color:#4A3729;line-height:1.6;white-space:pre-line;">${stu.note}</div>` : '';
  STATE.stuSchedPopup = `
    <div style="font-size:16px;font-weight:900;color:${grColor};">${stu.name} <span style="font-size:12px;color:#5E4A38;font-weight:700;">${stu.clsLabel} ${stu.num?stu.num+'번':''}</span></div>
    <div style="font-size:11px;color:#6E5A45;margin:2px 0 10px;">2학기 맞춤형 시간표 (8/20 목 개강 · 수 13:10~14:40 / 그 외 13:50~15:20)</div>
    ${rows}
    ${modeTxt}
    ${noteHtml}
    ${stu.phone?`<div style="margin-top:10px;"><a href="tel:${stu.phone}" style="background:#E2EEF2;border-radius:8px;padding:8px 14px;color:#14507A;font-size:12px;font-weight:700;text-decoration:none;display:inline-block;">📞 ${stu.phone}</a></div>`:''}
  `;
  render();
}

function showRosterPopup(clsKey,day,sessKey){
  const {s1,s2,s3}=getSessRoster(STATE.selSubj,day);
  const all=(sessKey==="s1"?s1:sessKey==="s2"?s2:s3);
  const stus = clsKey==='__all__' ? all : all.filter(s=>s.clsKey===clsKey);
  STATE.rosterPopup={clsKey,day,sessKey,stus};render();
}

            <div style="flex:1;">

                ${an

                  ${s.name} <span style="color:#C1440E;font-size:13px;">★</span>
                </span>`
              : `<span style="font-size:15px;font-weight:800;cursor:pointer;" onclick="showStuSchedulePopup('${s.id}')">${s.name}</span>`}
              </div>
              ${an?`<div style="font-size:10px;color:#A82015;">${an.slice(0,40)}</div>`:""}

            ${s.phone?`<a href="tel:${s.phone}" style="background:#E2EEF2;border:none;border-radius:20px;padding:6px 12px;color:#14507A;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;">📞 전화</a>`:""}

      +"</div>"
      +(memoVal?`<div style='margin-top:6px;font-size:10px;color:#B45F12;padding-left:48px;'>📌 ${memoVal.slice(0,40)}${memoVal.length>40?"…":""}</div>`:"")
      +"</div>";
  }
  html+="</div>";
  return html;
}


function renderAttendance(){
  const subj=STATE.selSubj,c=gc(subj);
  const DC={월:"#B07C10",화:"#4F6B22",수:"#C2530F",목:"#7A4A1F",금:"#A32411"};
  const {s1,s2,s3}=getSessRoster(subj,STATE.selDay);
  const sessTime={월:{s1:"13:50~14:30",s2:"14:40~15:20"},화:{s1:"13:50~14:30",s2:"14:40~15:20"},수:{s1:"13:10~13:50",s2:"14:00~14:40"},목:{s1:"13:50~14:30",s2:"14:40~15:20"},금:{s1:"13:50~14:30",s2:"14:40~15:20"}};
  const t=sessTime[STATE.selDay]||{};
  const isRobot2=subj==="로봇과학";
  const sessions=[];
  if(s1.length)sessions.push({label:isRobot2?"로봇과학A · 1교시":"맞춤형 1교시",time:t.s1||"",key:"s1",stus:s1});
  if(s2.length)sessions.push({label:isRobot2?"로봇과학B · 2교시":"맞춤형 2교시",time:t.s2||"",key:"s2",stus:s2});
  if(s3.length)sessions.push({label:"맞춤형 3교시",time:t.s3||"14:40~15:20",key:"s3",stus:s3});
  return `<div style="background:#FBF3E7;min-height:100vh;">
    ${hdr("출석부 — "+subj,"✅","#B23A0C")}
    <div style="display:flex;background:#fff;border-bottom:2px solid #E6D3B8;">
      ${DAYS.map(d=>{
        const {s1:ds1,s2:ds2,s3:ds3}=getSessRoster(subj,d);
        const hasCls=ds1.length>0||ds2.length>0||ds3.length>0;
        const isSel=STATE.selDay===d;
        return `<button onclick="setDay('${d}')" style="flex:1;padding:10px 0;border:none;cursor:pointer;background:${isSel?"#FDF0DC":"transparent"};border-bottom:3px solid ${isSel?"#B23A0C":"transparent"};color:${isSel?"#B23A0C":hasCls?"#3B2A1C":"#8A7350"};font-weight:${isSel?"900":"600"};font-size:12px;">${d}<br><span style="font-size:9px;opacity:0.7;">${DAY_DATES[d]||''}</span>${(()=>{ const [m,dy]=(DAY_DATES[d]||'/').split('/');const yr=new Date().getFullYear();const key=`${yr}-${String(m).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;return NO_CLASS_DATES&&NO_CLASS_DATES[key]?`<br><span style="font-size:7px;color:#B9291A;font-weight:800;">🚫수업없음</span>`:'' })()}</button>`;
      }).join("")}
    </div>
    <div style="padding:10px;display:flex;flex-direction:column;gap:10px;">
      ${sessions.length===0?`<div style="text-align:center;padding:60px 20px;"><div style="font-size:40px;margin-bottom:10px;">🌸</div><div style="font-size:15px;font-weight:700;color:#7A6754;">${STATE.selDay}요일에 ${subj} 수업이 없습니다.</div></div>`
      :sessions.map(({label,time,key,stus})=>{
        const cnt={present:0,absent:0,late:0,early:0,none:0};
        stus.forEach(s=>{const v=STATE.attRecord[STATE.selDay+"_"+key+"_"+s.id]||"";if(v)cnt[v]++;else cnt.none++;});
        return `<div style="background:#fff;border-radius:14px;overflow:hidden;border:1px solid #E6D3B8;box-shadow:0 2px 8px rgba(178,58,12,0.07);">
          <div style="background:linear-gradient(135deg,#F3DCB4,#FBEFD9);padding:12px 14px;border-bottom:2px solid #C8891B;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="color:#241708;font-weight:900;font-size:15px;">${label}</div>
                <div style="color:#6E5A45;font-size:11px;margin-top:2px;">🕐 ${time} · ${stus.length}명 · 📍${getPlaceByDay(subj,STATE.selDay,key)}</div>
              </div>
              <button onclick="markAll('${key}',${JSON.stringify(stus.map(s=>s.id))},'present')" style="background:#4B7A22;border:none;border-radius:20px;padding:6px 12px;color:#fff;font-size:11px;font-weight:900;cursor:pointer;">✓ 전원출석</button>
            </div>
            <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">
              ${cnt.present?`<span style="background:#E9F0D9;color:#4B7A22;font-size:10px;padding:3px 9px;border-radius:10px;font-weight:800;border:1px solid #4B7A2244;">✓ 출석 ${cnt.present}</span>`:""}
              ${cnt.absent?`<span style="background:#FBE1D6;color:#B9291A;font-size:10px;padding:3px 9px;border-radius:10px;font-weight:800;border:1px solid #B9291A44;">✗ 결석 ${cnt.absent}</span>`:""}
              ${cnt.late?`<span style="background:#FBEBC6;color:#B45F12;font-size:10px;padding:3px 9px;border-radius:10px;font-weight:800;border:1px solid #B45F1244;">▲ 지각 ${cnt.late}</span>`:""}
              ${cnt.early?`<span style="background:#DCE9EE;color:#14507A;font-size:10px;padding:3px 9px;border-radius:10px;font-weight:800;border:1px solid #14507A44;">◀ 조기 ${cnt.early}</span>`:""}
              ${cnt.none?`<span style="background:#FBF5EA;color:#6E5A45;font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;border:1px solid #E6D3B8;">○ 미체크 ${cnt.none}</span>`:""}
            </div>
          </div>
          ${stus.map(s=>stuCard(s,key)).join("")}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function setDay(d){STATE.selDay=d;openDrop=null;render();}
function togDrop(k){openDrop=openDrop===k?null:k;render();}
function setAtt(k,v){STATE.attRecord[k]=v;openDrop=null;render();}
function setMemo(k,v){STATE.memoRecord[k]=v;}
function markAll(sk,ids,v){ids.forEach(id=>{STATE.attRecord[STATE.selDay+"_"+sk+"_"+id]=v;});render();}

// ── 학사일정 ──
function renderCalendar(){
  const y=STATE.calYear,m=STATE.calMonth,sd=STATE.calSel;
  const dim=new Date(y,m+1,0).getDate(),fd=new Date(y,m,1).getDay();
  const tk=todayKey();
  const MNAMES=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const DNAMES=["일","월","화","수","목","금","토"];
  function toKey(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
  const cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const selKey=sd?toKey(y,m,sd):null;
  const selEvs=selKey?(CALENDAR[selKey]||[]):[];
  const isHol=selKey?NO_CLASS.has(selKey):false;
  return `<div style="background:#FBF3E7;min-height:100vh;">
    ${hdr("학사일정","📅","#14507A")}
    <div style="padding:14px;">
      <div style="background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <button onclick="prevMon()" style="background:none;border:none;font-size:24px;color:#14507A;cursor:pointer;font-weight:700;">‹</button>
        <span style="font-size:17px;font-weight:800;">${y}년 ${MNAMES[m]}</span>
        <button onclick="nextMon()" style="background:none;border:none;font-size:24px;color:#14507A;cursor:pointer;font-weight:700;">›</button>
      </div>
      <div style="background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <div class="cal-header">
          ${DNAMES.map((d,i)=>`<div class="cal-head-cell" style="color:${i===0?"#FFB3A0":i===6?"#F3C98A":"#F6E3C4"};">${d}</div>`).join("")}
        </div>
        <div class="cal-grid">
          ${cells.map((d,ci)=>{
            if(!d)return`<div class="cal-cell" style="opacity:0;"></div>`;
            const key=toKey(y,m,d),isToday=key===tk,isSel=d===sd;
            const hasEv=!!CALENDAR[key],isH=NO_CLASS.has(key);
            const col=ci%7===0?"#C62A18":ci%7===6?"#8C2F0D":isH?"#C62A18":"#241708";
            return `<div class="cal-cell" onclick="selCal(${d})" style="${isSel?"background:#F6E6CB":""}">
              <div class="cal-num ${isToday?"today":isSel?"sel":""}" style="color:${isToday?"#fff":col};">${d}</div>
              ${hasEv?`<div class="cal-dot" style="background:${isH?"#C62A18":"#8C2F0D"};"></div>`:""}
            </div>`;
          }).join("")}
        </div>
      </div>
      ${selKey?`<div style="background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <div style="font-size:13px;font-weight:800;color:#14507A;margin-bottom:8px;">${y}년 ${m+1}월 ${sd}일</div>
        ${isHol?`<div style="background:#FDE7D6;border-radius:8px;padding:8px 12px;color:#A82015;font-weight:700;font-size:13px;margin-bottom:6px;">🔴 수업 없는 날</div>`:""}
        ${selEvs.length===0&&!isHol?`<div style="color:#5E4A38;font-size:13px;">일정 없음</div>`:""}
        ${selEvs.map(ev=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #F6EEDD;"><span>${ev.emoji||"📌"}</span><span style="font-size:13px;font-weight:600;">${ev.label}</span></div>`).join("")}
      </div>`:""}
    </div>
  </div>`;
}
function prevMon(){if(STATE.calMonth===0){STATE.calYear--;STATE.calMonth=11;}else STATE.calMonth--;STATE.calSel=null;render();}
function nextMon(){if(STATE.calMonth===11){STATE.calYear++;STATE.calMonth=0;}else STATE.calMonth++;STATE.calSel=null;render();}
function selCal(d){STATE.calSel=STATE.calSel===d?null:d;render();}

// ── 공지사항 ──
function renderNotice(){
  if(STATE.noticeId!==null){
    const n=NOTICES.find(x=>x.id===STATE.noticeId);
    return `<div style="background:#FBF3E7;min-height:100vh;">
      ${hdr(n.title,"📢","#C1440E")}
      <div style="padding:14px;"><div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 5px rgba(0,0,0,0.06);">
        ${n.important?`<div style="display:inline-block;background:#FCEBD2;border-radius:8px;padding:4px 12px;margin-bottom:10px;"><span style="font-size:12px;color:#C1440E;font-weight:700;">📌 중요</span></div>`:""}
        <div style="font-size:11px;color:#5E4A38;margin-bottom:8px;">${n.date}</div>
        <div style="font-size:14px;line-height:1.8;color:#241708;white-space:pre-line;">${n.content}</div>
      </div></div>
    </div>`;
  }
  return `<div style="background:#FBF3E7;min-height:100vh;">
    ${hdr("공지사항","📢","#C1440E")}
    <div style="padding:10px;display:flex;flex-direction:column;gap:8px;">
      ${NOTICES.map(n=>`<button onclick="openNotice(${n.id})" style="background:#fff;border:none;border-radius:12px;padding:14px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,0.06);cursor:pointer;width:100%;border-left:4px solid ${n.important?"#C1440E":"#7A6754"};">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
          <span style="font-size:14px;font-weight:800;">${n.title}</span>
          ${n.important?`<span style="font-size:10px;background:#FCEBD2;color:#C1440E;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px;">중요</span>`:""}
        </div>
        <div style="font-size:11px;color:#5E4A38;margin-bottom:3px;">${n.date}</div>
        <div style="font-size:12px;color:#4A382A;">${n.content.slice(0,45)}…</div>
      </button>`).join("")}
    </div>
  </div>`;
}
function openNotice(id){STATE.noticeId=id;render();}

// ── 공통 ──
function hdr(title,icon,color){
  return `<div style="background:${color};padding:46px 14px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;">
    <button onclick="goBack()" style="background:rgba(255,255,255,0.2);border:none;border-radius:20px;width:34px;height:34px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;">←</button>
    <span style="font-size:18px;">${icon}</span>
    <span style="font-size:17px;font-weight:900;color:#fff;flex:1;">${title}</span>
  </div>`;
}
function goBack(){
  if(STATE.noticeId!==null){
    STATE.noticeId=null;
    // 공지에서 뒤로: prevScreen이 login/verify이면 그쪽으로, 아니면 현재 screen 유지
    if(STATE.screen==="notice"){
      STATE.screen=STATE.prevScreen||"login";
    }
    render();return;
  }
  if(STATE.rosterPopup){STATE.rosterPopup=null;render();return;}
  STATE.screen=STATE.prevScreen||"home";render();window.scrollTo(0,0);
}
function renderTabbar(){
  const tabs=[{s:"home",icon:"🏠",label:"홈"},{s:"timetable",icon:"🗓️",label:"시간표"},{s:"classtimetable",icon:"📋",label:"학급별"},{s:"attendance",icon:"✅",label:"출석부"},{s:"calendar",icon:"📅",label:"학사일정"},{s:"notice",icon:"📢",label:"공지"}];
  return `<div class="tabbar">${tabs.map(t=>`<button class="tab" onclick="goScreen('${t.s}')" style="${STATE.screen===t.s?"color:var(--primary);":""}"><span class="ti">${t.icon}</span><span class="tl" style="${STATE.screen===t.s?"color:var(--primary);font-weight:800;":""}">${t.label}</span></button>`).join("")}</div>`;
}
function render(){
  const sc=document.getElementById("screen");
  const showTab=!["login","verify"].includes(STATE.screen)&&!(STATE.screen==="notice"&&!STATE.instructor);
  const showTab2 = showTab && !inSummer();
  let tb=document.getElementById("tb-el");
  if(showTab2){if(!tb){tb=document.createElement("div");tb.id="tb-el";document.getElementById("app").appendChild(tb);}tb.innerHTML=renderTabbar();}
  else{if(tb)tb.remove();}
  let rp=document.getElementById("roster-pop");
  if(STATE.rosterPopup){if(!rp){rp=document.createElement("div");rp.id="roster-pop";document.getElementById("app").appendChild(rp);}rp.innerHTML=renderRosterPopup();}
  else{if(rp)rp.remove();}
  let np=document.getElementById("note-pop");
  if(STATE.notePopup){if(!np){np=document.createElement("div");np.id="note-pop";document.getElementById("app").appendChild(np);}np.innerHTML=renderNotePopup();}
  else{if(np)np.remove();}
  let sp=document.getElementById("stusched-pop");
  if(STATE.stuSchedPopup){if(!sp){sp=document.createElement("div");sp.id="stusched-pop";document.getElementById("app").appendChild(sp);}sp.innerHTML=renderStuSchedPopup();}
  else{if(sp)sp.remove();}
  if(STATE.screen==="login")sc.innerHTML=renderLogin();
  else if(STATE.screen==="verify")sc.innerHTML=renderVerify();
  else if(STATE.screen==="home"){sc.innerHTML=renderHome();fetchWeather();}
  else if(STATE.screen==="timetable")sc.innerHTML=renderTimetable_safe();
  else if(STATE.screen==="classtimetable")sc.innerHTML=renderClassTimetable();
  else if(STATE.screen==="studentsearch")sc.innerHTML=renderStudentSearch();
  else if(STATE.screen==="summer")sc.innerHTML=renderSummerSchedule();
  else if(STATE.screen==="attendance")sc.innerHTML=renderAttendance();
  else if(STATE.screen==="calendar")sc.innerHTML=renderCalendar();
  else if(STATE.screen==="notice")sc.innerHTML=renderNotice();
}
loadSession();
render();
</script>
